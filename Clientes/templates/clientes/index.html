{% extends 'clientes/base.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="p-4 p-md-5 mb-4 bg-light rounded-4 shadow-sm border">
                <div class="container-fluid py-2">
                    <h1 class="display-5 fw-bold text-dark text-center text-md-start">Bienvenido al Catálogo de la Biblioteca</h1>
                    <p class="col-md-10 fs-5 text-muted text-center text-md-start my-3">
                        Explora nuestros libros disponibles, consulta el catálogo y realiza tus reservas de forma rápida, segura y adaptada a tu dispositivo.
                    </p>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-4">
                        <a href="{% url 'Clientes:reservar_libro' %}" class="btn btn-primary btn-lg px-4 shadow-sm">
                            Reservar Libro
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
